name: Build MyClient

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Prepare project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path(".")
          java_root = root / "src/main/java"
          resources = root / "src/main/resources"

          java_root.mkdir(parents=True, exist_ok=True)
          resources.mkdir(parents=True, exist_ok=True)

          # Organize Java files according to their package declarations.
          for file in list(root.glob("*.java")):
              content = file.read_text(encoding="utf-8")
              match = re.search(r'^\s*package\s+([\w.]+)\s*;', content, re.M)

              if match:
                  package_path = Path(*match.group(1).split("."))
                  destination = java_root / package_path / file.name
              else:
                  destination = java_root / file.name

              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(file), str(destination))
              print(f"Java: {file.name} -> {destination}")

          # Move Fabric resources.
          for name in ["fabric.mod.json", "myclient.mixins.json", "en_us.json"]:
              source = root / name
              if source.exists():
                  shutil.move(str(source), str(resources / name))

          # Move sword textures and their JSON definitions.
          for pattern in ["sword_*.png", "sword_*.json"]:
              for source in root.glob(pattern):
                  shutil.move(str(source), str(resources / source.name))

          print("Project structure prepared.")
          PY

          echo "Project files:"
          find src -type f

      - name: Build
        run: gradle build --no-daemon

      - name: Verify JAR
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -name "*.jar" -type f
          test -n "$(find build/libs -maxdepth 1 -name '*.jar' -type f)"

      - name: Package Chunk Finder and Block ESP source
        run: |
          cat > ChunkFinder-BlockESP-README.txt <<'EOF'
          MYCLIENT - CHUNK FINDER + BLOCK ESP PATCH
          
          Target: Fabric 1.21.11, Java 21.
          
          This archive contains the complete chunkfinder package and the two module
          classes, module registry and world block-update mixin used by this patch.
          
          Copy the paths into the matching paths in your repository, replacing
          existing files when prompted. Do not copy the package directory into the
          project root; preserve the src/main/java directory structure.
          
          The module registry is included because it registers both modules.
          The mixin is included because it invalidates cached hive checks after
          a block update.
          
          The normal MyClient-JAR artifact is built separately by this workflow.
          EOF
          zip -r ChunkFinder-BlockESP.zip \
            ChunkFinder-BlockESP-README.txt \
            src/main/java/dev/myclient/chunkfinder \
            src/main/java/dev/myclient/module/modules/ChunkFinderModule.java \
            src/main/java/dev/myclient/module/modules/HiveChunkFinderModule.java \
            src/main/java/dev/myclient/module/Catalog.java \
            src/main/java/dev/myclient/mixin/ClientWorldBlockUpdateMixin.java

      - name: Upload Chunk Finder and Block ESP source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChunkFinder-BlockESP-SOURCE
          path: ChunkFinder-BlockESP.zip
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
