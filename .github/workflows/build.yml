name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 9.2.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -O "$HOME/gradle.zip"
          mkdir -p "$HOME/gradle"
          unzip -q "$HOME/gradle.zip" -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.2.0/bin" >> "$GITHUB_PATH"

      - name: Prepare project
        run: |
          ls -la
          if [ -f build.gradle ] && [ -d src ]; then
            echo "Folosesc proiectul din repo"
            echo "DIR=." >> "$GITHUB_ENV"
          else
            ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then echo "Nu gasesc nici proiect, nici zip in repo"; exit 1; fi
            echo "Folosesc $ZIP"
            rm -rf work
            mkdir work
            unzip -q -o "$ZIP" -d work
            DIR=$(dirname "$(find work -name build.gradle | head -n 1)")
            echo "DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          cd "$DIR"
          gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: myclient
          path: ${{ env.DIR }}/build/libs/*.jar
