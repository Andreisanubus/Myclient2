name: Build MyClient

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Organize project
        run: |
          mkdir -p src/main/java src/main/resources

          for file in *.java; do
            if [ -f "$file" ]; then
              mv "$file" src/main/java/
            fi
          done

          for file in fabric.mod.json myclient.mixins.json en_us.json *.png *.json; do
            if [ -f "$file" ] && [ "$file" != "build.gradle" ] && [ "$file" != "settings.gradle" ] && [ "$file" != "gradle.properties" ]; then
              mv "$file" src/main/resources/
            fi
          done

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
