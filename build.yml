name: Build MyClient

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Check project files
        run: |
          echo "Checking project..."
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          find . -maxdepth 3 -type f

      - name: Organize Java sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path(".")
          java_root = root / "src/main/java"
          java_root.mkdir(parents=True, exist_ok=True)

          for file in list(root.glob("*.java")):
              content = file.read_text(encoding="utf-8")
              match = re.search(r'^\s*package\s+([\w.]+)\s*;', content, re.M)

              if match:
                  destination = java_root / Path(*match.group(1).split(".")) / file.name
              else:
                  destination = java_root / file.name

              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(file), str(destination))
              print(f"Moved: {file.name} -> {destination}")
          PY

      - name: Organize resources
        run: |
          mkdir -p src/main/resources

          for file in fabric.mod.json myclient.mixins.json en_us.json *.png; do
            if [ -f "$file" ]; then
              mv "$file" src/main/resources/
            fi
          done

      - name: Build project
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
